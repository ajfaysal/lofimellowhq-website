<body data-page="contact">
  <a class="sr-only" href="#main-content">Skip to content</a>
  <div data-component="header"></div>

  <main id="main-content">
    <section class="page-hero" aria-labelledby="contact-heading">
      <div class="container stack-lg">
        <span class="eyebrow">Contact</span>
        <h1 class="title-xl" id="contact-heading">Contact LofiMellowHQ</h1>
        <p>For partnerships, licensing, media inquiries, and collaborations, send a message through the official form.</p>
      </div>
    </section>

    <section class="section" aria-labelledby="contact-form-title">
      <div class="container grid cards-2">
        <article class="glass-card form-shell">
          <div class="section-head">
            <span class="eyebrow">Message Form</span>
            <h2 class="title-lg" id="contact-form-title">Send a Message</h2>
          </div>
          <form class="form-grid" data-js="contact-form" novalidate>
            <div class="form-field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-field full">
              <label for="subject">Subject</label>
              <input id="subject" name="subject" type="text" required>
            </div>
            <div class="form-field full">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <div class="form-field full">
              <button class="btn btn-primary" type="submit">Submit Message</button>
            </div>
          </form>
          <div class="form-status" data-js="form-status" role="alert" aria-live="polite"></div>
        </article>

        <article class="glass-card form-shell">
          <div class="section-head">
            <span class="eyebrow">Contact Information</span>
            <h2 class="title-lg">Official Details</h2>
          </div>
          <div class="grid cards-auto" data-js="contact-info-grid"></div>
        </article>
      </div>
    </section>

    <div class="container" data-component="player"></div>
  </main>

  <div data-component="footer"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
